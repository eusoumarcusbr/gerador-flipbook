<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flipbook Creator — TCE-MT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--blue-900:#112d4e;--blue-700:#1b4f72;--blue-500:#2e86c1;--blue-300:#85c1e9;--blue-100:#d4e6f1;--blue-50:#eaf2f8;--green:#1abc9c;--gold:#d4a84b;--white:#fff;--gray-950:#1a1a2e;--gray-800:#34495e;--gray-600:#7f8c8d;--gray-300:#d5d8dc;--gray-100:#f2f3f4;--gray-50:#fafbfc;--font:Inter,system-ui,sans-serif;--font-display:'Fraunces',Georgia,serif;--font-mono:'JetBrains Mono',monospace;--r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:20px;--shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 30px rgba(0,0,0,.1);--primary:var(--blue-700);--accent:var(--blue-500);--bg:var(--gray-50);--surface:var(--white);--text:var(--gray-950);--text2:var(--gray-600);--border:var(--gray-300);--page-bg:var(--white)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;font-size:14px;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}

/* ═══ TOPBAR ═══ */
.topbar{background:var(--primary);color:#fff;padding:0 clamp(12px,3vw,24px);display:flex;align-items:center;justify-content:space-between;height:clamp(48px,8vh,56px);position:sticky;top:0;z-index:100;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:clamp(6px,2vw,14px);min-width:0}
.topbar-left .title{font-size:clamp(13px,3vw,16px);font-weight:700;letter-spacing:-.4px;white-space:nowrap}
.topbar-left .sep{width:1px;height:20px;background:rgba(255,255,255,.2)}
.topbar-left .badge{font-size:clamp(9px,2vw,11px);font-weight:600;opacity:.7;letter-spacing:.5px;white-space:nowrap}
.topbar-right{display:flex;gap:clamp(3px,1vw,6px);align-items:center;flex-shrink:0}
.tb{padding:clamp(5px,1.2vw,8px) clamp(8px,2vw,14px);border-radius:var(--r-sm);border:none;background:rgba(255,255,255,.08);color:#fff;font-size:clamp(10px,2.5vw,12px);cursor:pointer;font-family:var(--font);font-weight:500;transition:all .2s;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.16)}.tb.active{background:rgba(255,255,255,.22);font-weight:600}
.tb-sep{width:1px;height:24px;background:rgba(255,255,255,.12);margin:0 2px}
/* Hide labels on very small screens, show just abbreviated */
@media(max-width:480px){.tb-sep{display:none}.topbar-left .sep,.topbar-left .badge{display:none}.tb{padding:6px 8px;font-size:10px}}

/* ═══ EDITOR — Desktop 3-column ═══ */
.editor{display:grid;grid-template-columns:230px 1fr 300px;flex:1;overflow:hidden}
/* ═══ EDITOR — Mobile tab system ═══ */
@media(max-width:820px){
  .editor{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .mob-tabs{display:flex !important}
  .panel-l,.panel-r{display:none}
  .panel-l.mob-active,.panel-r.mob-active,.center.mob-active{display:flex !important}
  .center{min-height:0}
  .panel-l.mob-active{max-height:none;height:100%;overflow:auto;border-right:none;border-bottom:1px solid var(--border)}
  .panel-r.mob-active{max-height:none;height:100%;overflow:auto;border-left:none;border-top:1px solid var(--border)}
  .frame{width:min(90vw,400px)}
}
.mob-tabs{display:none;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.mob-tab{flex:1;padding:10px 0;text-align:center;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;min-width:0;font-family:var(--font)}
.mob-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.panel-l{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:clamp(10px,2vw,16px);border-bottom:1px solid var(--border)}
.lbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-family:var(--font-mono);margin-bottom:8px}
.sel{width:100%;padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--border);font-size:13px;font-family:var(--font);color:var(--primary);background:var(--surface);cursor:pointer}
.sel:focus{border-color:var(--accent);outline:none}
.plist{flex:1;overflow:auto;padding:8px}
.pi{padding:8px 10px;border-radius:var(--r-md);margin-bottom:4px;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.pi:hover{background:var(--blue-50)}.pi.sel{background:var(--blue-100);border-color:var(--accent)}
.pi .ic{font-size:15px;flex-shrink:0;width:28px;text-align:center}.pi .th{width:28px;height:36px;object-fit:cover;border-radius:4px;border:1px solid var(--border);flex-shrink:0}
.pi .inf{flex:1;min-width:0}.pi .inf .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary)}.pi .inf .n{font-size:10px;color:var(--text2);font-family:var(--font-mono)}
.pi .acts{display:none;gap:2px;flex-shrink:0}.pi.sel .acts{display:flex}
.pi .acts button{width:22px;height:22px;border:none;background:transparent;cursor:pointer;font-size:10px;color:var(--text2);border-radius:var(--r-sm);transition:all .15s}
.pi .acts button:hover{background:var(--blue-100)}.pi .acts button.dl{color:#e74c3c}.pi .acts button.dl:hover{background:#fce4e4}
.center{display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,28px);background:var(--bg);overflow:auto}
.frame{width:min(400px,66vw);aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;flex-shrink:0;box-shadow:var(--shadow-lg),0 0 0 1px rgba(0,0,0,.03)}
.panel-r{background:var(--surface);border-left:1px solid var(--border);overflow:auto;padding:clamp(12px,2vw,18px);display:flex;flex-direction:column;gap:16px}
.tg{display:flex;gap:8px;flex-wrap:wrap}.tgb{width:34px;height:34px;border-radius:var(--r-md);cursor:pointer;border:2.5px solid transparent;transition:all .2s}.tgb.act{transform:scale(1.12);box-shadow:var(--shadow-sm)}
.tn{font-size:12px;color:var(--text2);margin-top:4px}.hr{height:1px;background:var(--border)}
.fl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;display:block;font-family:var(--font-mono)}
.fi{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;font-family:var(--font);background:var(--surface);color:var(--text);outline:none;transition:all .2s}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,134,193,.1)}
textarea.fi{min-height:100px;resize:vertical}
.ub{width:100%;padding:11px;border:1.5px dashed var(--border);border-radius:var(--r-md);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .2s}
.ub:hover{border-color:var(--accent);color:var(--accent);background:var(--blue-50)}
.tb2{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--blue-50);border-radius:var(--r-md);font-size:13px;color:var(--primary);font-weight:600;border:1px solid var(--blue-100)}

/* ═══ 3D FLIPBOOK ═══ */
.preview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(8px,2vw,16px);background:var(--bg);overflow:hidden}
.scene{perspective:2400px;perspective-origin:50% 50%}
.book{height:min(70vh,70dvh);aspect-ratio:3/4;position:relative;transform-style:preserve-3d;max-width:92vw}
@media(max-width:600px){.book{height:auto;width:92vw;aspect-ratio:3/4}}
@media(orientation:landscape) and (max-height:500px){.book{height:min(70vh,70dvh);width:auto;max-width:92vw}}
.bshadow{position:absolute;bottom:-14px;left:5%;right:5%;height:22px;background:radial-gradient(ellipse,rgba(17,45,78,.16) 0%,transparent 70%);border-radius:50%;filter:blur(6px);z-index:0;transition:all .7s ease}
.spine{position:absolute;top:0;left:-5px;width:10px;height:100%;background:linear-gradient(90deg,rgba(17,45,78,.18),rgba(17,45,78,.03),rgba(17,45,78,.12));border-radius:4px 0 0 4px;z-index:50;pointer-events:none}
.leaf{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;transform-origin:left center;transition:transform .9s cubic-bezier(.4,.0,.2,1);z-index:1;pointer-events:none}
.leaf.flipping{z-index:100}.leaf.flipped{transform:rotateY(-180deg);z-index:0}
.lf{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:0 var(--r-sm) var(--r-sm) 0}
.lf-f{z-index:2;box-shadow:2px 0 8px rgba(0,0,0,.05),inset -3px 0 14px rgba(0,0,0,.02),inset 0 0 0 1px rgba(0,0,0,.03)}
.lf-b{transform:rotateY(180deg);z-index:1;box-shadow:-2px 0 8px rgba(0,0,0,.05),inset 3px 0 14px rgba(0,0,0,.02),inset 0 0 0 1px rgba(0,0,0,.03)}
.lf-b::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.04),transparent 18%);pointer-events:none}
.lf-f::after{content:'';position:absolute;top:0;right:0;width:40%;height:100%;background:linear-gradient(to left,rgba(17,45,78,.04),transparent);pointer-events:none;opacity:0;transition:opacity .4s}
.leaf.flipping .lf-f::after{opacity:1}
.bclick{position:absolute;top:0;width:45%;height:100%;z-index:200;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bclick.l{left:0;cursor:w-resize}.bclick.r{right:0;cursor:e-resize}
.nav{display:flex;align-items:center;gap:clamp(10px,3vw,16px);margin-top:clamp(8px,2vw,16px);flex-shrink:0}
.navb{width:clamp(38px,10vw,46px);height:clamp(38px,10vw,46px);border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--primary);cursor:pointer;font-size:clamp(18px,5vw,22px);display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:var(--shadow-sm);-webkit-tap-highlight-color:transparent}
.navb:hover:not(:disabled){background:var(--blue-50);border-color:var(--accent);transform:scale(1.06)}
.navb:disabled{color:var(--gray-300);cursor:default;box-shadow:none}
.dots{display:flex;gap:clamp(4px,1vw,6px);align-items:center;flex-wrap:wrap;justify-content:center;max-width:200px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray-300);cursor:pointer;transition:all .3s}.dot.act{width:20px;border-radius:4px;background:var(--accent)}
.nctr{font-size:clamp(12px,3vw,14px);font-family:var(--font-mono);font-weight:500;color:var(--primary)}
.nhint{font-size:clamp(10px,2.5vw,12px);color:var(--gray-300);font-family:var(--font-mono);margin-top:clamp(4px,1vw,10px);flex-shrink:0}
.pdfbtn-prev{margin-top:clamp(6px,1.5vw,12px);padding:clamp(7px,1.5vw,10px) clamp(16px,4vw,24px);border-radius:var(--r-md);border:1px solid var(--accent);background:var(--blue-50);color:var(--accent);font-size:clamp(11px,2.5vw,13px);font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.pdfbtn-prev:hover{background:var(--accent);color:#fff}

/* ═══ MODALS ═══ */
.mover{position:fixed;inset:0;background:rgba(17,45,78,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:clamp(10px,3vw,20px)}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:clamp(20px,4vw,32px);max-width:520px;width:100%;box-shadow:0 16px 50px rgba(0,0,0,.12);position:relative;max-height:90vh;overflow:auto}
.mx{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-600);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mx:hover{background:var(--gray-100);color:var(--text)}
.mi{font-size:24px;margin-bottom:8px;color:var(--accent)}.mt{font-size:clamp(16px,4vw,20px);font-weight:700;color:var(--primary);margin:0 0 4px}.ms{font-size:13px;color:var(--text2);margin:0}
.mbtns{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.mbtn{padding:10px 20px;border-radius:var(--r-md);font-size:13px;font-family:var(--font);cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-weight:500;transition:all .2s}
.mbtn.act{border-color:var(--accent);background:var(--blue-50);color:var(--primary);font-weight:600}
.pdfub{width:100%;padding:clamp(14px,3vw,20px);border-radius:var(--r-lg);border:2px dashed var(--border);background:var(--gray-50);cursor:pointer;font-size:14px;font-family:var(--font);color:var(--primary);font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s}
.pdfub:hover{border-color:var(--accent);background:var(--blue-50)}
.pbar{width:100%;height:5px;border-radius:3px;background:var(--gray-100);overflow:hidden;margin-bottom:14px}
.pfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s}
.dlb{width:100%;padding:14px;border-radius:var(--r-md);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 8px rgba(46,134,193,.25);transition:all .2s}
.dlb:hover{background:var(--primary)}
.cblk{background:var(--gray-950);color:var(--blue-100);padding:clamp(12px,3vw,18px);border-radius:var(--r-md);font-size:11px;font-family:var(--font-mono);overflow:auto;line-height:1.7;white-space:pre-wrap;word-break:break-all;position:relative}
.cpb{position:absolute;top:10px;right:10px;padding:5px 14px;border-radius:var(--r-sm);border:none;background:rgba(255,255,255,.1);color:var(--blue-100);font-size:11px;cursor:pointer;font-family:var(--font-mono);transition:all .2s}
.cpb:hover{background:rgba(255,255,255,.18)}.cpb.ok{background:var(--green);color:#fff}
.instr{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--r-md);padding:clamp(12px,3vw,18px);margin-top:18px}
.instr ol{font-size:13px;color:var(--text2);line-height:2;padding-left:20px}
@keyframes pls{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
.ldots{display:flex;justify-content:center;gap:5px;margin-top:14px}.ldot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.app-footer{background:var(--primary);color:rgba(255,255,255,.55);padding:clamp(6px,1.5vw,10px) clamp(12px,3vw,24px);font-size:clamp(9px,2vw,11px);text-align:center;font-family:var(--font);letter-spacing:.2px;line-height:1.4;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TH={tce:{name:"TCE-MT Institucional",primary:"#1b4f72",accent:"#2e86c1",bg:"#f7f9fb",text:"#1a1a2e",pageBg:"#fff"},proMulher:{name:"TCE Pró-Mulher",primary:"#6b2c5e",accent:"#c44569",bg:"#fdf6f0",text:"#2d1b2e",pageBg:"#fff"},modern:{name:"Moderno",primary:"#1a1a2e",accent:"#2e86c1",bg:"#f2f3f4",text:"#1a1a2e",pageBg:"#fff"},dark:{name:"Escuro",primary:"#0d1b2a",accent:"#3a86c8",bg:"#0d1b2a",text:"#e0e0e0",pageBg:"#1b2838"},nature:{name:"Sustentavel",primary:"#1a6b4a",accent:"#27ae60",bg:"#eafaf1",text:"#1a2e0a",pageBg:"#fafdf5"}};
const TP={cover:{n:"Capa",i:"●"},title:{n:"Titulo",i:"◇"},text:{n:"Texto",i:"≡"},imageText:{n:"Imagem+Texto",i:"▣"},twoColumns:{n:"Duas Colunas",i:"‖"},gallery:{n:"Galeria",i:"◈"},quote:{n:"Citacao",i:"❝"},pdfPage:{n:"PDF",i:"▤"},backCover:{n:"Contracapa",i:"◉"}};
let S={view:"editor",theme:"tce",logo:null,sel:0,prev:0,flip:false,pdfM:false,shareM:false,pdfL:false,pdfP:{c:0,t:0},pdfMode:"replace",pdfData:null,pdfName:"documento.pdf",mobTab:"preview",
pages:[{id:"p1",tpl:"cover",title:"Programacao Digital",sub:"Tribunal de Contas do Estado de Mato Grosso",body:"",img:null,quote:"",qa:""},{id:"p2",tpl:"text",title:"Apresentacao",sub:"",body:"Bem-vindo a programacao digital do TCE-MT.\n\nAqui voce encontra informacoes sobre eventos, capacitacoes e acoes institucionais do Tribunal.",img:null,quote:"",qa:""},{id:"p3",tpl:"quote",title:"",sub:"",body:"",img:null,quote:"Nao fiscalizamos apenas contas, cuidamos de pessoas.",qa:"TCE-MT"},{id:"p4",tpl:"backCover",title:"",sub:"Portas Abertas - Dialogo",body:"Tribunal de Contas do Estado de Mato Grosso\nwww.tce.mt.gov.br",img:null,quote:"",qa:""}]};
const v=()=>TH[S.theme],uid=()=>'p'+Date.now()+Math.random().toString(36).slice(2,6),np=(tpl)=>({id:uid(),tpl,title:"",sub:"",body:"",img:null,quote:"",qa:""});
function utv(){const th=v(),r=document.documentElement.style;r.setProperty('--primary',th.primary);r.setProperty('--accent',th.accent);r.setProperty('--bg',th.bg);r.setProperty('--text',th.text);r.setProperty('--page-bg',th.pageBg);document.body.style.background=th.bg}
const footer='<div class="app-footer">Desenvolvido pela SECOM do TCE-MT.</div>';

function rpc(p,pn,tot){const th=v();const bar=`<div style="height:3px;background:linear-gradient(90deg,${th.primary},${th.accent});width:100%;flex-shrink:0"></div>`;const foot=`<div style="padding:10px 22px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid ${th.primary}0a;font-size:10px;color:${th.primary}66;font-family:'JetBrains Mono',monospace;flex-shrink:0"><span></span><span>${pn} / ${tot}</span></div>`;const e=(s)=>(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');const b=`width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:${th.pageBg};color:${th.text};font-family:Inter,system-ui,sans-serif`;
if(p.tpl==="pdfPage")return`<div style="${b};padding:0">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:contain;background:#fff">`:`<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#bbb">PDF</div>`}</div>`;
if(p.tpl==="cover")return`<div style="${b};background:linear-gradient(160deg,${th.primary} 0%,${th.primary}e0 50%,${th.accent} 100%);color:#fff;justify-content:center;align-items:center;text-align:center;padding:clamp(24px,6vw,48px);position:relative"><div style="position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(255,255,255,.06),transparent 60%);pointer-events:none"></div>${S.logo?`<img src="${S.logo}" style="max-width:110px;max-height:70px;margin-bottom:20px;filter:brightness(0) invert(1);object-fit:contain">`:''}<div style="width:40px;height:2px;background:rgba(255,255,255,.35);margin:0 auto 16px"></div><h1 style="font-size:clamp(18px,4vw,28px);font-weight:700;line-height:1.3;margin:0 0 8px">${e(p.title)||'Titulo'}</h1>${p.sub?`<p style="font-size:clamp(11px,2vw,14px);opacity:.8;font-weight:300;max-width:85%;margin:0 auto;line-height:1.5">${e(p.sub)}</p>`:''}</div>`;
if(p.tpl==="title")return`<div style="${b}">${bar}<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 32px;text-align:center"><div style="width:32px;height:2px;background:${th.accent};margin:0 auto 14px"></div><h2 style="font-size:clamp(17px,3.5vw,24px);font-weight:700;color:${th.primary};margin:0 0 8px">${e(p.title)||'Secao'}</h2>${p.sub?`<p style="font-size:13px;color:${th.text}80;max-width:85%;margin:0 auto;line-height:1.6">${e(p.sub)}</p>`:''}</div>${foot}</div>`;
if(p.tpl==="quote")return`<div style="${b}">${bar}<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 32px"><div style="font-size:40px;color:${th.accent};line-height:1;margin-bottom:4px;font-family:'Fraunces',serif;opacity:.6">"</div><blockquote style="font-family:'Fraunces',serif;font-size:clamp(14px,2.5vw,19px);font-style:italic;color:${th.primary};line-height:1.55;margin:0 0 12px;padding-left:16px;border-left:2px solid ${th.accent}">${e(p.quote)||'...'}</blockquote>${p.qa?`<p style="font-size:12px;color:${th.accent};font-weight:600;padding-left:16px">— ${e(p.qa)}</p>`:''}</div>${foot}</div>`;
if(p.tpl==="imageText")return`<div style="${b}">${bar}<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">${p.img?`<div style="height:42%;overflow:hidden;flex-shrink:0"><img src="${p.img}" style="width:100%;height:100%;object-fit:cover"></div>`:''}<div style="flex:1;padding:16px 24px;overflow:auto">${p.title?`<h3 style="font-size:16px;font-weight:700;color:${th.primary};margin:0 0 6px">${e(p.title)}</h3>`:''}<p style="font-size:13px;line-height:1.7;color:${th.text}bb;margin:0">${e(p.body)||'...'}</p></div></div>${foot}</div>`;
if(p.tpl==="twoColumns"){const pts=(p.body||'Col 1\n---\nCol 2').split('\n---\n');return`<div style="${b}">${bar}<div style="padding:16px 24px 0">${p.title?`<h3 style="font-size:16px;font-weight:700;color:${th.primary};margin:0 0 10px">${e(p.title)}</h3>`:''}</div><div style="flex:1;display:flex;gap:16px;padding:0 24px 16px;overflow:auto"><div style="flex:1;font-size:12px;line-height:1.7;color:${th.text}bb">${e(pts[0])}</div><div style="width:1px;background:${th.primary}0a;flex-shrink:0"></div><div style="flex:1;font-size:12px;line-height:1.7;color:${th.text}bb">${e(pts[1]||'')}</div></div>${foot}</div>`}
if(p.tpl==="gallery")return`<div style="${b}">${bar}<div style="flex:1;display:flex;flex-direction:column;padding:16px 24px">${p.title?`<h3 style="font-size:16px;font-weight:700;color:${th.primary};margin:0 0 10px">${e(p.title)}</h3>`:''} ${p.img?`<div style="flex:1;border-radius:6px;overflow:hidden"><img src="${p.img}" style="width:100%;height:100%;object-fit:cover"></div>`:`<div style="flex:1;border-radius:6px;border:2px dashed ${th.primary}18;display:flex;align-items:center;justify-content:center;color:${th.primary}44;font-size:13px">Imagem</div>`}</div>${foot}</div>`;
if(p.tpl==="backCover")return`<div style="${b};background:linear-gradient(160deg,${th.primary},${th.primary}ee);color:#fff;justify-content:center;align-items:center;text-align:center;padding:40px">${S.logo?`<img src="${S.logo}" style="max-width:90px;max-height:55px;margin-bottom:18px;filter:brightness(0) invert(1);object-fit:contain">`:''}<p style="font-size:13px;opacity:.75;max-width:80%;line-height:1.6">${e(p.body)||'Obrigado'}</p>${p.sub?`<p style="font-size:11px;opacity:.45;margin-top:10px">${e(p.sub)}</p>`:''}</div>`;
return`<div style="${b}">${bar}<div style="flex:1;padding:20px 24px;overflow:auto">${p.title?`<h3 style="font-size:16px;font-weight:700;color:${th.primary};margin:0 0 8px">${e(p.title)}</h3>`:''}<p style="font-size:13px;line-height:1.75;color:${th.text}bb;margin:0">${e(p.body)||'...'}</p></div>${foot}</div>`}

function bbook(){const pg=S.pages,cur=S.prev,tot=pg.length;let lv='';for(let i=pg.length-1;i>=0;i--){const fl=i<cur;const fr=rpc(pg[i],i+1,tot);const bk=`<div style="width:100%;height:100%;background:${v().pageBg}"></div>`;lv+=`<div class="leaf${fl?' flipped':''}" id="lf-${i}" style="z-index:${fl?i:tot-i}"><div class="lf lf-f">${fr}</div><div class="lf lf-b">${bk}</div></div>`}
return`<div class="scene"><div class="book" id="bk"><div class="bshadow" id="bsh"></div><div class="spine"></div>${lv}<div class="bclick l" onclick="pv()"></div><div class="bclick r" onclick="nx()"></div></div></div><div class="nav"><button class="navb" onclick="pv()" ${cur===0?'disabled':''}>&#8249;</button>${tot<=20?`<div class="dots">${pg.map((_,i)=>`<div class="dot${i===cur?' act':''}" onclick="gp(${i})"></div>`).join('')}</div>`:`<span class="nctr">${cur+1} / ${tot}</span>`}<button class="navb" onclick="nx()" ${cur===tot-1?'disabled':''}>&#8250;</button></div>${S.pdfData?'<button class="pdfbtn-prev" onclick="dlpdf()">Baixar PDF original</button>':''}<div class="nhint">Deslize ou use as setas para navegar</div>`}

function topbarHTML(){const th=v();return`<div class="topbar"><div class="topbar-left"><span class="title">Flipbook Creator</span><span class="sep"></span><span class="badge">TCE-MT</span></div><div class="topbar-right"><button class="tb" onclick="opdf()">Importar PDF</button><button class="tb" onclick="osh()">Compartilhar</button><div class="tb-sep"></div><button class="tb${S.view==='editor'?' active':''}" onclick="sv('editor')">Editor</button><button class="tb${S.view==='preview'?' active':''}" onclick="sv('preview')">Preview</button></div></div>`}

function render(){utv();const th=v(),pg=S.pages,sl=S.sel,app=document.getElementById('app');
if(!S.pdfM){const m=document.getElementById('pdfM');if(m)m.remove()}
if(!S.shareM){const m=document.getElementById('shM');if(m)m.remove()}
if(S.view==="editor"){
  const mt=S.mobTab;
  app.innerHTML=topbarHTML()+`<div class="mob-tabs"><div class="mob-tab${mt==='pages'?' active':''}" onclick="smt('pages')">Paginas</div><div class="mob-tab${mt==='preview'?' active':''}" onclick="smt('preview')">Visualizar</div><div class="mob-tab${mt==='edit'?' active':''}" onclick="smt('edit')">Editar</div></div>
  <div class="editor">
    <div class="panel-l${mt==='pages'?' mob-active':''}"><div class="panel-header"><div class="lbl">Paginas &middot; ${pg.length}</div><select class="sel" onchange="ap(this.value);this.value=''"><option value="">+ Adicionar pagina</option>${Object.entries(TP).filter(([k])=>k!=='pdfPage').map(([k,t])=>`<option value="${k}">${t.i} ${t.n}</option>`).join('')}</select></div><div class="plist">${pg.map((p,i)=>`<div class="pi${i===sl?' sel':''}" onclick="sp(${i})">${p.tpl==='pdfPage'&&p.img?`<img class="th" src="${p.img}">`:`<span class="ic">${TP[p.tpl]?.i||'◇'}</span>`}<div class="inf"><div class="nm">${p.title||TP[p.tpl]?.n||'Pagina'}</div><div class="n">${i+1}</div></div><div class="acts"><button onclick="event.stopPropagation();mp(${i},-1)">&#8593;</button><button onclick="event.stopPropagation();mp(${i},1)">&#8595;</button><button class="dl" onclick="event.stopPropagation();rp(${i})">&#215;</button></div></div>`).join('')}</div></div>
    <div class="center${mt==='preview'?' mob-active':''}"><div class="frame">${rpc(pg[sl],sl+1,pg.length)}</div></div>
    <div class="panel-r${mt==='edit'?' mob-active':''}"><div><div class="lbl">Tema</div><div class="tg">${Object.entries(TH).map(([k,t])=>`<div class="tgb${S.theme===k?' act':''}" style="background:linear-gradient(135deg,${t.primary} 50%,${t.accent} 50%);border-color:${S.theme===k?t.primary:'transparent'}" onclick="st('${k}')" title="${t.name}"></div>`).join('')}</div><div class="tn">${th.name}</div></div><div><div class="lbl">Logo</div><input type="file" id="li" accept="image/*" style="display:none" onchange="hl(event)"><button class="ub" onclick="document.getElementById('li').click()">${S.logo?'Trocar logo':'Upload logo'}</button>${S.logo?`<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><img src="${S.logo}" style="height:24px;object-fit:contain"><button style="border:none;background:transparent;color:#e74c3c;cursor:pointer;font-size:12px;font-weight:500" onclick="S.logo=null;render()">Remover</button></div>`:''}</div><div class="hr"></div><div><div class="lbl">Editar Pag. ${sl+1}</div>${redi(pg[sl])}</div></div>
  </div>`+footer;
} else {
  app.innerHTML=topbarHTML()+`<div class="preview">${bbook()}</div>`+footer;
  const bk=document.getElementById('bk');
  if(bk){let ts=null;bk.addEventListener('touchstart',e=>{ts=e.touches[0].clientX},{passive:true});bk.addEventListener('touchend',e=>{if(ts===null)return;const d=ts-e.changedTouches[0].clientX;if(Math.abs(d)>50){d>0?nx():pv()}ts=null},{passive:true})}
}
if(S.pdfM)rpdfm();if(S.shareM)rshm()}

function redi(p){if(p.tpl==="pdfPage")return`<div class="tb2"><span>▤</span> Pagina PDF</div>${p.img?`<img src="${p.img}" style="width:100%;border-radius:6px;margin-top:10px;border:1px solid var(--border)">`:''}<p style="font-size:12px;color:var(--text2);margin-top:8px">Importada como imagem.</p>`;
let h=`<div class="tb2"><span>${TP[p.tpl]?.i||''}</span> ${TP[p.tpl]?.n||''}</div>`;
if(p.tpl!=="backCover")h+=`<div style="margin-top:12px"><label class="fl">Titulo</label><input class="fi" value="${(p.title||'').replace(/"/g,'&quot;')}" oninput="uf('title',this.value)"></div>`;
if(["cover","title","backCover"].includes(p.tpl))h+=`<div style="margin-top:12px"><label class="fl">Subtitulo</label><input class="fi" value="${(p.sub||'').replace(/"/g,'&quot;')}" oninput="uf('sub',this.value)"></div>`;
if(["text","imageText","twoColumns","backCover","gallery"].includes(p.tpl))h+=`<div style="margin-top:12px"><label class="fl">${p.tpl==="twoColumns"?"Texto (--- separa)":p.tpl==="gallery"?"Legenda":"Corpo"}</label><textarea class="fi" oninput="uf('body',this.value)">${(p.body||'').replace(/</g,'&lt;')}</textarea></div>`;
if(p.tpl==="quote"){h+=`<div style="margin-top:12px"><label class="fl">Citacao</label><textarea class="fi" style="min-height:80px" oninput="uf('quote',this.value)">${(p.quote||'').replace(/</g,'&lt;')}</textarea></div>`;h+=`<div style="margin-top:12px"><label class="fl">Autor</label><input class="fi" value="${(p.qa||'').replace(/"/g,'&quot;')}" oninput="uf('qa',this.value)"></div>`}
if(["imageText","gallery"].includes(p.tpl))h+=`<div style="margin-top:12px"><label class="fl">Imagem</label><input type="file" id="pii" accept="image/*" style="display:none" onchange="hpi(event)"><button class="ub" onclick="document.getElementById('pii').click()">${p.img?'Trocar imagem':'Upload imagem'}</button>${p.img?`<img src="${p.img}" style="width:100%;height:80px;object-fit:cover;border-radius:6px;margin-top:8px">`:''}</div>`;
return h}

function sp(i){S.sel=i;render()}
function sv(vw){if(vw==='preview')S.prev=S.sel;S.view=vw;render()}
function st(k){S.theme=k;render()}
function smt(tab){S.mobTab=tab;render()}
function ap(tpl){if(!tpl)return;S.pages.splice(S.sel+1,0,np(tpl));S.sel++;render()}
function rp(i){if(S.pages.length<=1)return;S.pages.splice(i,1);S.sel=Math.min(S.sel,S.pages.length-1);render()}
function mp(i,d){const ni=i+d;if(ni<0||ni>=S.pages.length)return;[S.pages[i],S.pages[ni]]=[S.pages[ni],S.pages[i]];S.sel=ni;render()}
function uf(f,val){S.pages[S.sel][f]=val;const fr=document.querySelector('.frame');if(fr)fr.innerHTML=rpc(S.pages[S.sel],S.sel+1,S.pages.length)}
function hl(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{S.logo=ev.target.result;render()};r.readAsDataURL(f)}
function hpi(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{S.pages[S.sel].img=ev.target.result;render()};r.readAsDataURL(f)}

/* Navigation */
function nx(){const cur=S.prev,tot=S.pages.length;if(cur>=tot-1||S.flip)return;S.flip=true;const l=document.getElementById('lf-'+cur);if(l){l.classList.add('flipping');l.style.zIndex=100;l.classList.add('flipped');const sh=document.getElementById('bsh');if(sh){sh.style.transform='scaleX(1.15)';sh.style.opacity='.9'}setTimeout(()=>{l.classList.remove('flipping');l.style.zIndex=cur;if(sh){sh.style.transform='';sh.style.opacity=''}S.prev=cur+1;S.flip=false;unav()},950)}}
function pv(){const cur=S.prev;if(cur<=0||S.flip)return;S.flip=true;const li=cur-1;const l=document.getElementById('lf-'+li);if(l){l.classList.add('flipping');l.style.zIndex=100;l.classList.remove('flipped');const sh=document.getElementById('bsh');if(sh){sh.style.transform='scaleX(1.15)';sh.style.opacity='.9'}setTimeout(()=>{l.classList.remove('flipping');l.style.zIndex=S.pages.length-li;if(sh){sh.style.transform='';sh.style.opacity=''}S.prev=cur-1;S.flip=false;unav()},950)}}
function gp(i){if(S.flip||i===S.prev)return;S.prev=i;render()}
function unav(){document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('act',i===S.prev));const c=document.querySelector('.nctr');if(c)c.textContent=`${S.prev+1} / ${S.pages.length}`;const bs=document.querySelectorAll('.navb');if(bs[0])bs[0].disabled=S.prev===0;if(bs[1])bs[1].disabled=S.prev===S.pages.length-1}
function dlpdf(){if(!S.pdfData)return;const a=document.createElement('a');a.href=S.pdfData;a.download=S.pdfName;a.click()}
document.addEventListener('keydown',e=>{if(S.view!=='preview'||S.pdfM||S.shareM)return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nx()}if(e.key==='ArrowLeft'){e.preventDefault();pv()}});

/* PDF Modal */
function opdf(){S.pdfM=true;S.pdfMode="replace";render()}
function cpdf(){S.pdfM=false;S.pdfL=false;const m=document.getElementById('pdfM');if(m)m.remove();render()}
function spm(m){S.pdfMode=m;render()}
function rpdfm(){let ex=document.getElementById('pdfM');if(ex)ex.remove();const d=document.createElement('div');d.id='pdfM';d.className='mover';d.onclick=e=>{if(e.target===d)cpdf()};
if(!S.pdfL){d.innerHTML=`<div class="modal"><button class="mx" onclick="cpdf()">&#215;</button><div style="text-align:center;margin-bottom:22px"><div class="mi">PDF</div><h3 class="mt">Importar PDF</h3><p class="ms">Cada pagina vira uma pagina do flipbook</p></div><div class="mbtns"><button class="mbtn ${S.pdfMode==='replace'?'act':''}" onclick="spm('replace')">Substituir tudo</button><button class="mbtn ${S.pdfMode==='append'?'act':''}" onclick="spm('append')">Adicionar ao final</button></div><input type="file" id="pfi" accept=".pdf,application/pdf" style="display:none" onchange="hpdf(event)"><button class="pdfub" onclick="document.getElementById('pfi').click()">Selecionar arquivo PDF</button></div>`}
else{const pct=S.pdfP.t>0?Math.round((S.pdfP.c/S.pdfP.t)*100):0;d.innerHTML=`<div class="modal"><div style="text-align:center"><div class="mi">PDF</div><h3 class="mt" style="margin-bottom:16px">Importando...</h3><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><p style="font-size:13px;color:var(--primary);font-family:var(--font-mono)">Pagina ${S.pdfP.c} de ${S.pdfP.t}</p><div class="ldots"><div class="ldot" style="animation:pls 1.2s ease-in-out 0s infinite"></div><div class="ldot" style="animation:pls 1.2s ease-in-out .2s infinite"></div><div class="ldot" style="animation:pls 1.2s ease-in-out .4s infinite"></div></div></div></div>`}
document.body.appendChild(d)}
async function hpdf(event){const file=event.target.files?.[0];if(!file)return;S.pdfL=true;S.pdfP={c:0,t:0};S.pdfName=file.name||'documento.pdf';rpdfm();await new Promise(r=>setTimeout(r,100));
try{const ab=await file.arrayBuffer();const u8=new Uint8Array(ab);let bin='';for(let i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);S.pdfData='data:application/pdf;base64,'+btoa(bin);
const pdf=await pdfjsLib.getDocument({data:ab}).promise;S.pdfP.t=pdf.numPages;rpdfm();const pages=[];
for(let i=1;i<=pdf.numPages;i++){S.pdfP.c=i;rpdfm();await new Promise(r=>setTimeout(r,50));const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pages.push({id:uid(),tpl:'pdfPage',title:'Pagina '+i,sub:'',body:'',img:c.toDataURL('image/jpeg',.82),quote:'',qa:''})}
if(S.pdfMode==='replace'){S.pages=pages;S.sel=0}else{const pl=S.pages.length;S.pages=[...S.pages,...pages];S.sel=pl}}catch(err){alert('Erro: '+(err.message||err))}
S.pdfL=false;S.pdfM=false;const m=document.getElementById('pdfM');if(m)m.remove();render()}

/* Share Modal */
function osh(){S.shareM=true;render()}
function csh(){S.shareM=false;const m=document.getElementById('shM');if(m)m.remove();render()}
function rshm(){let ex=document.getElementById('shM');if(ex)ex.remove();const th=v();const ic='<!-- Flipbook TCE-MT -->\n<iframe src="SEU_LINK/flipbook.html"\n  width="100%" height="700" frameborder="0"\n  style="border:none;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.08);"\n  allowfullscreen></iframe>';
const d=document.createElement('div');d.id='shM';d.className='mover';d.onclick=e=>{if(e.target===d)csh()};
d.innerHTML=`<div class="modal"><button class="mx" onclick="csh()">&#215;</button><div style="text-align:center;margin-bottom:22px"><div class="mi">Compartilhar</div><h3 class="mt">Exportar Flipbook</h3><p class="ms">${S.pages.length} paginas &middot; ${th.name}</p></div><div style="margin-bottom:20px"><div class="lbl">1. Baixar HTML</div><button class="dlb" onclick="dlf()">Baixar flipbook.html</button><p style="font-size:12px;color:var(--text2);margin-top:8px">Responsivo, preenche a tela em qualquer dispositivo.</p></div><div style="margin-bottom:20px"><div class="lbl">2. Codigo iframe</div><div class="cblk"><pre style="margin:0">${ic.replace(/</g,'&lt;')}</pre><button class="cpb" onclick="cc(this,'${btoa(encodeURIComponent(ic))}')">Copiar</button></div></div><div class="instr"><p style="font-size:13px;font-weight:600;color:var(--primary);margin:0 0 8px">Como usar:</p><ol><li>Baixe o <strong>flipbook.html</strong></li><li>Hospede no servidor do TCE-MT</li><li>Cole o iframe no portal ou intranet</li></ol></div></div>`;
document.body.appendChild(d)}
function cc(btn,enc){const txt=decodeURIComponent(atob(enc));navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copiado!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('ok')},2000)})}

/* Download */
function dlf(){const th=v(),pg=S.pages,ia=JSON.stringify(pg.map(p=>p.img||''));
